// Reference scene: a document, an output, and a timed command script. Scenes
// feed the golden-image tests, the per-frame counter gate (perf/baseline.json)
// and `engined --preview`. Internal test format, not part of the engine
// contracts; the document inside is a normal engine.v1.Document.
//
// Scene files are this message in protobuf's JSON mapping: scenes/*.scene.json.
// SPDX-License-Identifier: MPL-2.0
syntax = "proto3";

package engine.testing.v1;

import "engine/v1/common.proto";
import "engine/v1/command.proto";
import "engine/v1/document.proto";

message ReferenceScene {
  string name = 1;
  string description = 2;
  engine.v1.Document document = 3;
  OutputSpec output = 4;
  repeated ScriptStep script = 5;   // applied at the first frame edge at or after at_ms
  repeated uint32 golden_at_ms = 6; // timestamps captured for golden images
  uint32 duration_ms = 7;           // counter runs and previews loop over this
}

message OutputSpec {
  uint32 width = 1;
  uint32 height = 2;
  engine.v1.Rational rate = 3;      // e.g. 60000/1001
}

message ScriptStep {
  uint32 at_ms = 1;
  engine.v1.Command command = 2;
}
